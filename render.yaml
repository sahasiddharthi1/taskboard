services:
  - type: web
    name: taskboard-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Public share links point at the Vercel frontend (not this API host).
      - key: PUBLIC_BASE_URL
        value: https://taskboard-two-plum.vercel.app
      # Secrets are set in the Render dashboard (not committed to this repo):
      #   DATABASE_URL       -> libsql://taskboard-sahasiddharthi1.aws-us-east-2.turso.io
      #   TURSO_AUTH_TOKEN   -> token from Turso dashboard
      #   JWT_SECRET         -> generate with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"