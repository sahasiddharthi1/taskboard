<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="workspace">
        <div class="burger">☰</div>
        <div>
          <div class="workspace-name">Taskboard</div>
          <div class="workspace-tag">my daily board</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-filter="all">
          <span class="nav-icon">#</span> All tasks
        </button>
        <button class="nav-item" data-filter="pending">
          <span class="nav-icon">◌</span> Pending
        </button>
        <button class="nav-item" data-filter="done">
          <span class="nav-icon">✓</span> Completed
        </button>
      </nav>

      <div class="nav-section">
        <div class="nav-section-title">Days</div>
        <div id="day-list" class="day-list"></div>
      </div>

      <div class="sidebar-footer">
        <div class="avatar" id="avatar"></div>
        <div class="user-meta">
          <div class="user-name" id="user-name"></div>
          <div class="logout-btn" id="logout-btn">Sign out</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="channel-header">
        <div>
          <div class="channel-title" id="channel-title"># all-tasks</div>
          <div class="channel-desc" id="channel-desc"></div>
        </div>
        <div class="share-actions">
          <button class="btn btn-whatsapp" id="whatsapp-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.019-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Share on WhatsApp
          </button>
          <button class="btn btn-ghost" id="copy-btn">Copy link</button>
        </div>
      </header>

      <section class="board" id="board">
        <div class="empty" id="empty-state">No tasks here yet. Add your first one below.</div>
      </section>

      <footer class="composer">
        <div class="composer-box">
          <input id="task-input" type="text" placeholder="Write down a task for today…" autocomplete="off" />
          <button id="add-btn" class="send-btn">Add</button>
        </div>
      </footer>
    </main>
  </div>

  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="auth-logo">#</div>
      <h1>Taskboard</h1>
      <p class="auth-sub">Your daily tasks. Kept forever, only removed when you say so.</p>

      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
      </div>

      <form id="auth-form" autocomplete="off">
        <label for="username">Username</label>
        <input id="username" type="text" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <div class="auth-error" id="auth-error"></div>
        <button class="btn btn-primary btn-block" id="auth-submit" type="submit">Login</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
